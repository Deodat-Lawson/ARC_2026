<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildfire meadow · standalone preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1218;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hint {
        position: fixed;
        left: 10px;
        bottom: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        font: 12px/1.4 system-ui, sans-serif;
        color: #cfe8ff;
        background: rgba(8, 14, 22, 0.72);
        pointer-events: none;
        max-width: min(420px, 92vw);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "@dgreenheck/ez-tree": "./vendor/ez-tree.es.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="meadowCanvas" aria-label="Meadow preview"></canvas>
    <div class="hint">
      独立预览 · 拖拽旋转 · 滚轮缩放 · 右键平移 · 与 mission simulation 无关。开发时用：<code>/simulation/wildfire-meadow-preview.html</code>
    </div>
    <script type="module" src="./js/wildfire-meadow-preview.js"></script>
  </body>
</html>
