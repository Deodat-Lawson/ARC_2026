<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>A.R.C. Player — Frontend Tests</title>
  <style>
    :root {
      --bg: #050d1a; --text: #c0d8f0; --pass: #39ff14;
      --fail: #ff4444; --warn: #ff8c00; --dim: #607090;
      --border: #1a4a7a; --panel: rgba(5,18,40,0.95);
      --font: 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font);
           font-size: 13px; padding: 20px; }
    h1 { color: #00bfff; letter-spacing: 4px; font-size: 18px; margin-bottom: 4px;
         text-shadow: 0 0 10px #00bfff; }
    .subtitle { color: var(--dim); font-size: 11px; margin-bottom: 20px; }
    #summary { display: flex; gap: 20px; margin-bottom: 16px; padding: 10px 14px;
               background: var(--panel); border: 1px solid var(--border); border-radius: 3px; }
    .sum-item { display: flex; flex-direction: column; align-items: center; }
    .sum-num  { font-size: 26px; font-weight: bold; }
    .sum-lbl  { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
    #suite-list { display: flex; flex-direction: column; gap: 10px; }
    .suite { background: var(--panel); border: 1px solid var(--border);
             border-radius: 3px; overflow: hidden; }
    .suite-header { padding: 8px 14px; font-size: 12px; letter-spacing: 1px;
                    display: flex; justify-content: space-between; align-items: center;
                    border-bottom: 1px solid var(--border); }
    .suite-badge { font-size: 10px; padding: 2px 7px; border-radius: 2px; }
    .badge-pass { background: rgba(57,255,20,0.15); color: var(--pass); border: 1px solid var(--pass); }
    .badge-fail { background: rgba(255,68,68,0.15); color: var(--fail); border: 1px solid var(--fail); }
    .badge-run  { background: rgba(0,191,255,0.15); color: #00bfff; border: 1px solid #00bfff; }
    .test-row { display: flex; align-items: flex-start; gap: 8px;
                padding: 5px 14px; border-bottom: 1px solid rgba(26,74,122,0.3); }
    .test-row:last-child { border-bottom: none; }
    .test-icon { font-size: 12px; min-width: 14px; margin-top: 1px; }
    .test-name { flex: 1; }
    .test-detail { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .test-err  { font-size: 11px; color: var(--fail); background: rgba(255,68,68,0.08);
                 padding: 3px 6px; border-radius: 2px; margin-top: 3px; white-space: pre-wrap; }
    .test-time { font-size: 10px; color: var(--dim); min-width: 50px; text-align: right; }
    #log-box { margin-top: 16px; background: var(--panel); border: 1px solid var(--border);
               border-radius: 3px; padding: 10px 14px; max-height: 200px; overflow-y: auto; }
    #log-box pre { font-size: 11px; color: var(--dim); line-height: 1.6; }
    #hidden-canvas { display: none; }
    #hidden-player  { display: none; }
  </style>
</head>
<body>

<h1>A · R · C</h1>
<div class="subtitle">Frontend Test Suite — player.js unit &amp; integration tests</div>

<div id="summary">

<script src="player.js"></script>
<script>
/* =========================================================================
   A.R.C. Frontend Test Runner (vanilla JS, zero dependencies)
   ========================================================================= */

'use strict';

// ── Mini test framework ───────────────────────────────────────────────────

const suites = [];
let currentSuite = null;

function describe(name, fn) {
  currentSuite = { name, tests: [] };
  suites.push(currentSuite);
  fn();
  currentSuite = null;
}

function it(name, fn) {
  currentSuite.tests.push({ name, fn, async: fn.constructor.name === 'AsyncFunction' });
}

function expect(val) {
  return {
    toBe:         (exp) => { if (val !== exp)    throw new Error(`Expected ${JSON.stringify(exp)}, got ${JSON.stringify(val)}`); },
    toEqual:      (exp) => { if (JSON.stringify(val) !== JSON.stringify(exp)) throw new Error(`Expected ${JSON.stringify(exp)}, got ${JSON.stringify(val)}`); },
    toBeTruthy:   ()    => { if (!val)            throw new Error(`Expected truthy, got ${val}`); },
    toBeFalsy:    ()    => { if (val)             throw new Error(`Expected falsy, got ${val}`); },
    toBeGreaterThan: (n) => { if (!(val > n))     throw new Error(`${val} is not > ${n}`); },
    toBeLessThan:    (n) => { if (!(val < n))     throw new Error(`${val} is not < ${n}`); },
    toBeGreaterThanOrEqual: (n) => { if (!(val >= n)) throw new Error(`${val} is not >= ${n}`); },
    toBeLessThanOrEqual:    (n) => { if (!(val <= n)) throw new Error(`${val} is not <= ${n}`); },
    toBeInstanceOf: (cls) => { if (!(val instanceof cls)) throw new Error(`Expected instance of ${cls.name}`); },
    toContain:   (sub) => { if (!String(val).includes(sub)) throw new Error(`"${val}" does not contain "${sub}"`); },
    toHaveLength: (n)  => { if (val.length !== n)           throw new Error(`Length ${val.length} !== ${n}`); },
    toBeArray:   ()    => { if (!Array.isArray(val))         throw new Error(`Expected array, got ${typeof val}`); },
    toBeNull:    ()    => { if (val !== null)                throw new Error(`Expected null, got ${val}`); },
    toBeString:  ()    => { if (typeof val !== 'string')     throw new Error(`Expected string, got ${typeof val}`); },
    toBeNumber:  ()    => { if (typeof val !== 'number' || isNaN(val)) throw new Error(`Expected number, got ${val}`); },
    toBeBoolean: ()    => { if (typeof val !== 'boolean')    throw new Error(`Expected boolean, got ${typeof val}`); },
    inRange:     (lo, hi) => { if (val < lo || val > hi) throw new Error(`${val} not in [${lo}, ${hi}]`); },
  };
}

// ── Logging ───────────────────────────────────────────────────────────────

const logEl = document.getElementById('log');
function log(...args) {
  logEl.textContent += args.join(' ') + '\n';
}

// ── Render ────────────────────────────────────────────────────────────────

function renderResults(results) {
  const suiteList = document.getElementById('suite-list');
  suiteList.innerHTML = '';
  let totalPass = 0, totalFail = 0;
  const startTs = results._startTs;

  results.suites.forEach(suite => {
    const passCount = suite.results.filter(r => r.status === 'pass').length;
    const failCount = suite.results.filter(r => r.status === 'fail').length;
    totalPass += passCount; totalFail += failCount;

    const div = document.createElement('div');
    div.className = 'suite';

    const badge = failCount > 0
      ? `<span class="suite-badge badge-fail">${failCount} FAILED</span>`
      : `<span class="suite-badge badge-pass">ALL PASS</span>`;

    div.innerHTML = `
      <div class="suite-header">
        <span>${suite.name}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <span style="color:var(--dim);font-size:11px">${passCount}/${suite.results.length}</span>
          ${badge}
        </span>
      </div>`;

    suite.results.forEach(r => {
      const icon  = r.status === 'pass' ? '✓' : r.status === 'skip' ? '○' : '✗';
      const color = r.status === 'pass' ? 'var(--pass)' : r.status === 'skip' ? 'var(--dim)' : 'var(--fail)';
      const row   = document.createElement('div');
      row.className = 'test-row';
      row.innerHTML = `
        <span class="test-icon" style="color:${color}">${icon}</span>
        <div class="test-name">
          <div style="color:${r.status==='fail'?'var(--fail)':r.status==='skip'?'var(--dim)':'var(--text)'}">${r.name}</div>
          ${r.error ? `<div class="test-err">${escHtml(r.error)}</div>` : ''}
        </div>
        <span class="test-time">${r.ms}ms</span>`;
      div.appendChild(row);
    });

    suiteList.appendChild(div);
  });

  const elapsed = Date.now() - startTs;
  document.getElementById('s-total').textContent = totalPass + totalFail;
  document.getElementById('s-pass').textContent  = totalPass;
  document.getElementById('s-fail').textContent  = totalFail;
  document.getElementById('s-time').textContent  = elapsed;
  document.title = `[${totalFail ? totalFail + ' FAIL' : 'ALL PASS'}] A.R.C. Tests`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Runner ────────────────────────────────────────────────────────────────

async function runAll() {
  const startTs = Date.now();
  const results = { suites: [], _startTs: startTs };

  for (const suite of suites) {
    const suiteResult = { name: suite.name, results: [] };
    log(`\n[Suite] ${suite.name}`);

    for (const test of suite.tests) {
      const t0 = Date.now();
      let status = 'pass', error = null;
      try {
        if (test.async) {
          await test.fn();
        } else {
          test.fn();
        }
        log(`  PASS  ${test.name}`);
      } catch (e) {
        status = 'fail';
        error  = e.message;
        log(`  FAIL  ${test.name}\n        ${e.message}`);
      }
      suiteResult.results.push({
        name: test.name, status, error, ms: Date.now() - t0,
      });
    }
    results.suites.push(suiteResult);
  }

  renderResults(results);
}

// =========================================================================
//  TEST SUITES
// =========================================================================

// ── 1. Utility functions ──────────────────────────────────────────────────

describe('Utility Functions', () => {

  it('lerp(0, 10, 0.5) === 5', () => {
    expect(lerp(0, 10, 0.5)).toBe(5);
  });

  it('lerp clamps at t=0', () => {
    expect(lerp(5, 10, 0)).toBe(5);
  });

  it('lerp clamps at t=1', () => {
    expect(lerp(5, 10, 1)).toBe(10);
  });

  it('lerp clamps t < 0', () => {
    expect(lerp(0, 10, -1)).toBe(0);
  });

  it('lerp clamps t > 1', () => {
    expect(lerp(0, 10, 2)).toBe(10);
  });

  it('cx(0) === CELL/2', () => {
    expect(cx(0)).toBe(CELL / 2);
  });

  it('cx(1) === CELL + CELL/2', () => {
    expect(cx(1)).toBe(CELL + CELL / 2);
  });

  it('cy(0) === CELL/2', () => {
    expect(cy(0)).toBe(CELL / 2);
  });

  it('COLORS has uav, ugv, balloon entries', () => {
    expect(typeof COLORS.uav).toBeString();
    expect(typeof COLORS.ugv).toBeString();
    expect(typeof COLORS.balloon).toBeString();
  });

  it('TOAST_CFG has rescued entry', () => {
    expect(TOAST_CFG.rescued).toBeTruthy();
    expect(TOAST_CFG.rescued.icon).toBeTruthy();
    expect(TOAST_CFG.rescued.color).toBeTruthy();
  });

});

// ── 2. Canvas setup ───────────────────────────────────────────────────────

describe('Canvas Setup', () => {

  it('setupCanvas returns a CanvasRenderingContext2D', () => {
    const c = document.getElementById('hidden-canvas');
    const ctx = setupCanvas(c, 100, 100);
    expect(ctx).toBeInstanceOf(CanvasRenderingContext2D);
  });

  it('setupCanvas applies devicePixelRatio scaling', () => {
    const c = document.createElement('canvas');
    document.body.appendChild(c);
    const dpr = window.devicePixelRatio || 1;
    setupCanvas(c, 200, 100);
    expect(c.width).toBe(200 * dpr);
    expect(c.height).toBe(100 * dpr);
    document.body.removeChild(c);
  });

  it('MAP_COLS constant is 30', () => {
    expect(MAP_COLS).toBe(30);
  });

  it('MAP_ROWS constant is 30', () => {
    expect(MAP_ROWS).toBe(30);
  });

  it('CELL constant is 20', () => {
    expect(CELL).toBe(20);
  });

});

// ── 3. Typewriter ─────────────────────────────────────────────────────────

describe('Typewriter Effect', () => {

  it('typewriter clears and starts filling element', (done) => {
    const el = document.getElementById('thinking-text');
    el.textContent = 'old content';
    typewriter(el, 'A', 5);
    setTimeout(() => {
      expect(el.textContent.length).toBeGreaterThan(0);
    }, 50);
  });

  it('typewriter called twice cancels first', () => {
    const el = document.getElementById('thinking-text');
    typewriter(el, 'first string', 50);
    typewriter(el, 'second',       50);
    // After cancel, textContent should be reset (second call clears first)
    expect(el.textContent.length).toBeLessThan(12);
  });

});

// ── 4. Toast ──────────────────────────────────────────────────────────────

describe('Toast Notifications', () => {

  it('showToast adds element to toast-layer', () => {
    const layer = document.getElementById('toast-layer');
    const before = layer.children.length;
    showToast({ type: 'rescued', description: 'V1 RESCUED!' });
    expect(layer.children.length).toBe(before + 1);
  });

  it('showToast uses correct color for rescued event', () => {
    const layer = document.getElementById('toast-layer');
    showToast({ type: 'rescued', description: 'Test rescue' });
    const toast = layer.lastElementChild;
    expect(toast.style.color).toContain('39');   // #39ff14 green
  });

  it('showToast uses correct color for sacrifice event', () => {
    const layer = document.getElementById('toast-layer');
    showToast({ type: 'sacrifice', description: 'Drone sacrificed' });
    const toast = layer.lastElementChild;
    expect(toast.style.color).toContain('ff8c00'); // orange
  });

  it('showToast uses default config for unknown event type', () => {
    const layer = document.getElementById('toast-layer');
    showToast({ type: 'totally_unknown_xyz', description: 'Test' });
    const toast = layer.lastElementChild;
    expect(toast).toBeTruthy();
  });

  it('TOAST_CFG contains all expected event types', () => {
    const required = ['hub_formed','rescued','sacrifice','energy_transfer',
                      'alert','victim_dead','balloon_deployed','comm_restored'];
    required.forEach(t => expect(TOAST_CFG[t]).toBeTruthy());
  });

});

// ── 7. ARCPlayer integration (requires timeline.json) ────────────────────

describe('ARCPlayer Integration', () => {

  let player = null;
  let timeline = null;

  it('timeline.json is reachable (fetch test)', async () => {
    const res = await fetch('timeline.json');
    expect(res.ok).toBeTruthy();
    timeline = await res.json();
    expect(timeline).toBeTruthy();
  });

  it('timeline has scenario_id', () => {
    if (!timeline) return;
    expect(typeof timeline.scenario_id).toBeString();
  });

  it('timeline has total_steps > 0', () => {
    if (!timeline) return;
    expect(timeline.total_steps).toBeGreaterThan(0);
  });

  it('timeline.frames is array with correct length', () => {
    if (!timeline) return;
    expect(Array.isArray(timeline.frames)).toBeTruthy();
    expect(timeline.frames.length).toBe(timeline.total_steps);
  });

  it('ARCPlayer instantiates without error', () => {
    if (!timeline) return;
    // Set up required DOM elements for player
    const mc = document.getElementById('map-canvas');
    const cc = document.getElementById('chart-canvas');
    setupCanvas(mc, MAP_COLS * CELL, MAP_ROWS * CELL);
    setupCanvas(cc, 240, 90);
    let threw = false;
    try {
      player = new ARCPlayer(timeline);
    } catch (e) {
      threw = true;
      log('ARCPlayer error: ' + e.message);
    }
    expect(threw).toBeFalsy();
  });

  it('player.step starts at 0', () => {
    if (!player) return;
    expect(player.step).toBe(0);
  });

  it('player.playing starts false', () => {
    if (!player) return;
    expect(player.playing).toBeFalsy();
  });

  it('player.speed starts at 1.0', () => {
    if (!player) return;
    expect(player.speed).toBe(1.0);
  });

  it('player.total matches timeline.total_steps', () => {
    if (!player || !timeline) return;
    expect(player.total).toBe(timeline.total_steps);
  });

  it('player._seek(0) does not throw', () => {
    if (!player) return;
    let threw = false;
    try { player._seek(0); } catch (e) { threw = true; }
    expect(threw).toBeFalsy();
  });

  it('player._seek(last step) works', () => {
    if (!player) return;
    let threw = false;
    try { player._seek(player.total - 1); } catch (e) { threw = true; }
    expect(threw).toBeFalsy();
    expect(player.step).toBe(player.total - 1);
  });

  it('player._seek out-of-bounds clamps correctly', () => {
    if (!player) return;
    player._seek(-99);
    expect(player.step).toBe(0);
    player._seek(9999);
    expect(player.step).toBe(player.total - 1);
  });

  it('first frame has agents array', () => {
    if (!timeline) return;
    expect(Array.isArray(timeline.frames[0].agents)).toBeTruthy();
    expect(timeline.frames[0].agents.length).toBeGreaterThan(0);
  });

  it('first frame has victims array', () => {
    if (!timeline) return;
    expect(Array.isArray(timeline.frames[0].victims)).toBeTruthy();
    expect(timeline.frames[0].victims.length).toBeGreaterThan(0);
  });

  it('last frame stats.rescued >= 1 (at least 1 person saved)', () => {
    if (!timeline) return;
    const last = timeline.frames[timeline.frames.length - 1];
    expect(last.stats.rescued).toBeGreaterThanOrEqual(1);
  });

  it('renderFrame does not throw for first frame', () => {
    if (!player || !timeline) return;
    let threw = false;
    try { renderFrame(timeline.frames[0], 0, 0); } catch (e) { threw = true; }
    expect(threw).toBeFalsy();
  });

  it('renderFrame does not throw for last frame', () => {
    if (!player || !timeline) return;
    const last = timeline.frames[timeline.frames.length - 1];
    let threw = false;
    try { renderFrame(last, 1, 1000); } catch (e) { threw = true; }
    expect(threw).toBeFalsy();
  });

});

// ── 8. Stats counter animation ────────────────────────────────────────────

describe('Stats Counter Animation', () => {

  it('popCounter sets correct value', () => {
    const el = document.getElementById('stat-rescued');
    popCounter(el, 3);
    expect(el.textContent).toBe('3');
  });

  it('popCounter adds and removes pop class', (done) => {
    const el = document.getElementById('stat-sacrificed');
    popCounter(el, 1);
    expect(el.classList.contains('pop')).toBeTruthy();
    setTimeout(() => {
      expect(el.classList.contains('pop')).toBeFalsy();
    }, 300);
  });

});
